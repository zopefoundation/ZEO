# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/pure-python
[build-system]
requires = [
    "setuptools >= 78.1.1,< 81",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "ZEO"
version = "6.2"
license = "ZPL-2.1"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Framework :: ZODB",
]
dynamic = ["readme"]
requires-python = ">=3.10"
authors = [
    {name = "Zope Foundation and contributors",email = "zodb@googlegroups.com"},
]
maintainers = [
    {name = "Plone Foundation and contributors",email = "zope-dev@zope.dev"},
]
dependencies = [
    "ZODB >= 5.1.1",
    "transaction >= 2.0.3",
    "persistent >= 4.1.0",
    "zc.lockfile",
    "ZConfig",
    "zdaemon",
    "zope.interface",
]
keywords = ["database", "zodb"]

[project.scripts]
zeopack = "ZEO.scripts.zeopack:main"
runzeo = "ZEO.runzeo:main"
zeoctl = "ZEO.zeoctl:main"
zeo-nagios = "ZEO.nagios:main"

[project.optional-dependencies]
test = [
    "ZConfig",
    "ZODB >= 5.5.1",
    "ZopeUndo",
    "zope.testing",
    "transaction",
    "msgpack",
    "zdaemon",
    "zope.testrunner",
]
uvloop = ["uvloop >=0.5.1"]
msgpack = ["msgpack-python"]
docs = [
    "Sphinx",
    "repoze.sphinx.autointerface",
    "sphinx_rtd_theme",
]

[project.urls]
Documentation = "https://zeo.readthedocs.io/"
Source = "https://github.com/zopefoundation/ZEO"
Issues = "https://github.com/zopefoundation/ZEO/issues"
Changelog = "https://raw.githubusercontent.com/zopefoundation/ZEO/master/CHANGES.rst"

[tool.coverage.run]
branch = true
source = ["ZEO"]

[tool.coverage.report]
fail_under = 53
precision = 2
ignore_errors = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "pragma: nocover",
    "except ImportError:",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "self.fail",
    "raise AssertionError",
    "raise unittest.Skip",
]

[tool.coverage.html]
directory = "parts/htmlcov"

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.rst"]}

