[buildout]
develop = .
parts =
    test
    scripts

[test]
recipe = zc.recipe.testrunner
eggs =
    ZEO[test]
# ZopeUndo is needed as soft-dependency for a regression test
    ZopeUndo
initialization =
  import os, tempfile
  try: os.mkdir('tmp')
  except: pass
  tempfile.tempdir = os.path.abspath('tmp')
defaults = ['--all']

[scripts]
recipe = zc.recipe.egg
eggs = ${test:eggs}
interpreter = py
